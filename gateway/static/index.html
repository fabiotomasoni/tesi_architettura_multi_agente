<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway locale — prova PDF</title>
<style>body{font:17px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#183044;background:#f7fafc}section{background:white;padding:24px;border:1px solid #d5dfe6;border-radius:12px;margin:20px 0}button{padding:12px 18px;border:0;border-radius:6px;background:#155e75;color:white;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}label{display:block;margin:12px 0}#status{font-weight:600}</style>
<h1>Prova del gateway locale</h1><p>Carica i PDF di un solo fascicolo sintetico. Il gateway estrae i dati, verifica gli scenari e prepara le viste minimizzate. Non produce ancora un report finanziario.</p>
<section><form id="upload"><label>PDF del fascicolo <input id="files" type="file" accept="application/pdf,.pdf" multiple required></label>
<label><input type="checkbox" name="scenario" value="S-01" checked> S-01 — Mutuo</label><label><input type="checkbox" name="scenario" value="S-02" checked> S-02 — Interessi e fiscalità</label>
<button id="submit">Carica e verifica</button><button id="close" type="button" disabled>Chiudi e cancella sessione</button></form><p id="status" role="status"></p></section>
<section id="results" hidden><h2>Esito e provenienza locale</h2><pre id="summary"></pre><button id="markets" type="button">Esegui agente mercati (A2A → MCP → Ollama)</button><button id="workflow" type="button">Esegui workflow S-01 e chiudi sessione</button><pre id="agent-result"></pre><h2>Viste per gli specialisti</h2><pre id="views"></pre></section>
<script>
let session=null;const el=id=>document.getElementById(id);
async function removeSession(){if(!session)return;const r=await fetch('/sessions/'+session,{method:'DELETE'});if(!r.ok&&r.status!==404)throw Error('Impossibile chiudere la sessione');session=null;el('close').disabled=true;}
el('close').onclick=async()=>{try{await removeSession();el('results').hidden=true;el('summary').textContent='';el('views').textContent='';el('status').textContent='Sessione cancellata.';}catch(e){el('status').textContent=e.message;}};
el('markets').onclick=async()=>{if(!session)return;el('markets').disabled=true;el('agent-result').textContent='Agente in esecuzione…';try{const r=await fetch('/sessions/'+session+'/markets',{method:'POST'});el('agent-result').textContent=JSON.stringify(await r.json(),null,2);}catch(e){el('agent-result').textContent='Servizio non raggiungibile';}finally{el('markets').disabled=false;}};
el('workflow').onclick=async()=>{if(!session)return;el('workflow').disabled=true;el('markets').disabled=true;el('submit').disabled=true;el('close').disabled=true;try{const r=await fetch('/sessions/'+session+'/workflow',{method:'POST'});const data=await r.json();el('agent-result').textContent=JSON.stringify(data,null,2);if(data.session_closed){session=null;el('summary').textContent='Profilo rimosso dal gateway a fine workflow.';el('views').textContent='';el('status').textContent='Workflow concluso; carica nuovi PDF per un’altra esecuzione.';}}catch(e){el('agent-result').textContent='Richiesta interrotta: verificare lo stato della sessione.';}finally{el('workflow').disabled=!session;el('markets').disabled=!session;el('close').disabled=!session;el('submit').disabled=false;}};
el('upload').onsubmit=async e=>{e.preventDefault();el('submit').disabled=true;el('status').textContent='Elaborazione locale…';el('results').hidden=true;el('agent-result').textContent='';
try{const scenarios=[...document.querySelectorAll('[name=scenario]:checked')].map(x=>x.value);if(!scenarios.length)throw Error('Seleziona almeno uno scenario.');await removeSession();const form=new FormData();for(const f of el('files').files)form.append('files',f);for(const s of scenarios)form.append('scenarios',s);
const response=await fetch('/sessions/pdf',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:(data.detail?.message||'Ingresso non valido'));session=data.session_id;el('close').disabled=false;el('workflow').disabled=false;el('markets').disabled=false;el('summary').textContent=JSON.stringify(data,null,2);const views={};for(const s of scenarios){const r=await fetch('/sessions/'+session+'/views',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:s,recipient:s==='S-01'?'markets':'tax'})});views[s]=await r.json();}el('views').textContent=JSON.stringify(views,null,2);el('results').hidden=false;el('status').textContent='Verifica completata. Chiudi la sessione quando hai finito.';}catch(error){el('status').textContent=error.message;}finally{el('submit').disabled=false;}};
window.addEventListener('pagehide',()=>{if(session)fetch('/sessions/'+session,{method:'DELETE',keepalive:true}).catch(()=>{});});
</script></html>
